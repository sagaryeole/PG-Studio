name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        PG Studio deliberately stays small and read-only. Before proposing, have a look at the [roadmap](https://github.com/sagaryeole/PG-Studio/blob/main/ROADMAP.md),
        including the "Not planned" section. Ideas that keep the safety rules (no SQL from the browser, identifiers from the catalog,
        values as bind parameters, bounded reads) are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
