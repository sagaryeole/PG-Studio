name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  smoke:
    name: Smoke test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [14, 15, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: bookshop
          POSTGRES_PASSWORD: demo_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookshop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGPASSWORD: demo_admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Load demo data
        run: psql -v ON_ERROR_STOP=1 -q -h 127.0.0.1 -U postgres -d bookshop -f demo/seed.sql
      - name: Start PG Studio
        run: node dist/server.js > server.log 2>&1 &
        env:
          DATABASE_URL: postgres://pgstudio_ro:demo_ro@127.0.0.1:5432/bookshop
          PORT: "4321"
      - run: npm run test:smoke
      - name: Server log
        if: always()
        run: cat server.log

  package:
    name: npm package and container image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookshop
          POSTGRES_PASSWORD: demo_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookshop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGPASSWORD: demo_admin
      TEST_URL: postgres://pgstudio_ro:demo_ro@127.0.0.1:5432/bookshop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load demo data
        run: psql -v ON_ERROR_STOP=1 -q -h 127.0.0.1 -U postgres -d bookshop -f demo/seed.sql
      # Install the packed tarball the way `npx` would, so a missing file in "files" fails here.
      - name: npm package
        run: |
          npm pack
          npm install -g ./sagaryeole-pg-studio-*.tgz
          pg-studio --version
          pg-studio "$TEST_URL" --port 4331 > cli.log 2>&1 &
          bash scripts/smoke-test.sh 4331
      - name: Container image
        run: |
          docker build -t pg-studio:ci .
          docker run -d --name pgs --network host -e PORT=4332 -e DATABASE_URL="$TEST_URL" pg-studio:ci
          bash scripts/smoke-test.sh 4332
      - name: Logs
        if: always()
        run: |
          cat cli.log || true
          docker logs pgs || true
